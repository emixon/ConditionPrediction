name: Build LaTeX Document

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build_latex:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Check out the repository content
      - name: Set up Git repository
        uses: actions/checkout@v4

      # Step 2: Compile the LaTeX document
      - name: Compile LaTeX document
        uses: xu-cheng/latex-action@v3
        with:
          root_file: ./Introduction.tex # Change this to match your primary .tex file name
          working_directory: ./Documents/Introduction/ 

      - name: Compile LaTeX document
        uses: xu-cheng/latex-action@v3
        with:
          root_file: ./CEE_492_Final_Report.tex # Change this to match your primary .tex file name
          working_directory: ./Documents/FinalReport/

      # Step 3: Upload the generated PDF as an artifact
      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: intro-pdf
          path: ./Documents/Introduction/Introduction.pdf # Change this if your root file has a different name

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: final-pdf
          path: ./Documents/FinalReport/CEE_492_Final_Report.pdf # Change this if your root file has a different name
